<!DOCTYPE html>
<!--
OpenDesign Hub / device-authorized.html
模板变量：
- {{userName}}：已登录用户姓名。
- {{userEmail}}：已登录用户邮箱。
- {{gitlabHost}}：GitLab 主机名，例如 gitlab.example.com。
- {{deeplinkUrl}}：返回桌面应用的完整链接，例如 opendesign://…（需属性转义）。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!--
模板约定：
- 文本与属性值均须由后端进行 HTML 转义（包括双引号、单引号、&、<、>）。
- 所有 URL 须在转义前由后端校验；禁止 javascript: / data: 等可执行协议。
  应用链接仅允许受信任的应用协议；登录、下载、返回链接仅允许受信任的 HTTP(S) 或站内路径。
- 不直接将用户值拼入 JS 模板字面量源代码；在服务端使用已转义的变量替换占位符。
- 本文件无脚本、无自动跳转、无外部字体或资源请求；浅色/深色由系统偏好决定。
- 未替换的双花括号内容为有意保留的服务端模板占位符，直接打开可预览布局。
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>登录成功 · OpenDesign Hub</title>
  <style>
    :root {
      --bg:      oklch(98% 0.005 250);
      --surface: oklch(100% 0 0);
      --fg:      oklch(22% 0.02 240);
      --muted:   oklch(50% 0.018 240);
      --border:  oklch(90% 0.008 240);
      --accent:  oklch(58% 0.16 145);

      --font-display: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-body:    -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', system-ui, sans-serif;
      --font-mono:    'JetBrains Mono', 'IBM Plex Mono', ui-monospace, Menlo, monospace;
      --subtle: oklch(97% 0.004 240);
      --success-bg: oklch(95% 0.025 145);
      --success-fg: oklch(37% 0.09 145);
      --primary-bg: var(--fg);
      --primary-fg: var(--surface);
      --primary-hover: oklch(12% 0.02 240);
      --shadow: oklch(22% 0.02 240 / 0.04);
      color-scheme: light dark;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: oklch(17% 0.012 240);
        --surface: oklch(22% 0.014 240);
        --fg: oklch(94% 0.005 240);
        --muted: oklch(76% 0.012 240);
        --border: oklch(36% 0.015 240);
        --accent: oklch(72% 0.14 145);
        --subtle: oklch(25% 0.014 240);
        --success-bg: oklch(28% 0.035 145);
        --success-fg: oklch(79% 0.11 145);
        --primary-bg: oklch(92% 0.005 240);
        --primary-fg: oklch(20% 0.02 240);
        --primary-hover: oklch(100% 0 0);
        --shadow: oklch(0% 0 0 / 0.1);
      }
    }
    * { box-sizing: border-box; }
    html { min-block-size: 100%; -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-block-size: 100vh;
      min-block-size: 100svh;
      display: flex;
      padding: clamp(1.5rem, 6vh, 4rem) clamp(1rem, 4vw, 2rem);
      background: var(--bg);
      color: var(--fg);
      font-family: var(--font-body);
      font-size: 1rem;
      line-height: 1.65;
      font-variant-numeric: tabular-nums;
    }
    .page { inline-size: min(100%, 36rem); min-inline-size: 0; margin: auto; }
    .brand {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.625rem;
      margin-block-end: 1.5rem;
      padding-inline: 0.125rem;
      font-size: 1.0625rem;
      font-weight: 650;
      letter-spacing: -0.025em;
      line-height: 1.5;
    }
    .brand-tag {
      border: 1px solid var(--border);
      border-radius: 0.3125rem;
      padding: 0.0625rem 0.4375rem;
      color: var(--muted);
      background: var(--surface);
      font-size: 0.8125rem;
      font-weight: 550;
      letter-spacing: 0;
    }
    .panel {
      min-inline-size: 0;
      padding: clamp(1.5rem, 5vw, 2.5rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 0.25rem 1.5rem var(--shadow);
    }
    .status-line { display: flex; align-items: center; gap: 0.75rem; margin-block-end: 1.5rem; }
    .status-icon {
      display: inline-flex;
      flex: 0 0 auto;
      align-items: center;
      justify-content: center;
      inline-size: 2.75rem;
      block-size: 2.75rem;
      border: 1px solid var(--border);
      border-radius: 0.8125rem;
      color: var(--fg);
      background: var(--subtle);
    }
    .status-icon.success { border-color: transparent; color: var(--success-fg); background: var(--success-bg); }
    .status-label { margin: 0; color: var(--muted); font-size: 0.875rem; font-weight: 550; }
    h1, h2, p, dl, dd { margin: 0; }
    h1 {
      font-family: var(--font-display);
      font-size: clamp(1.75rem, 4.5vw, 2rem);
      font-weight: 650;
      letter-spacing: -0.04em;
      line-height: 1.3;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }
    .description { margin-block-start: 0.875rem; color: var(--muted); overflow-wrap: anywhere; text-wrap: pretty; }
    .details { margin-block-start: 1.75rem; border-block: 1px solid var(--border); }
    .data-row { display: grid; grid-template-columns: 6.5rem minmax(0, 1fr); gap: 0.75rem; padding-block: 0.9375rem; }
    .data-row + .data-row { border-block-start: 1px solid var(--border); }
    dt { color: var(--muted); font-size: 0.875rem; }
    dd { min-inline-size: 0; font-size: 0.9375rem; overflow-wrap: anywhere; }
    .identity-name { display: block; font-weight: 600; }
    .identity-email { display: block; margin-block-start: 0.125rem; color: var(--muted); font-size: 0.875rem; }
    .mono { font-family: var(--font-mono); font-size: 0.8125rem; letter-spacing: 0; }
    .workspace {
      margin-block-start: 1.75rem;
      padding: 1.125rem 1.25rem;
      border: 1px solid var(--border);
      border-radius: 0.625rem;
      background: var(--subtle);
      min-inline-size: 0;
    }
    .field-label { margin-block-end: 0.375rem; color: var(--muted); font-size: 0.875rem; }
    .workspace-name { font-size: 1.25rem; line-height: 1.5; font-weight: 600; letter-spacing: -0.02em; overflow-wrap: anywhere; }
    .workspace + .details { margin-block-start: 1rem; border-block-start: 0; }
    .badge {
      display: inline-block;
      max-inline-size: 100%;
      padding: 0.0625rem 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.3125rem;
      background: var(--subtle);
      color: var(--fg);
      font-family: var(--font-mono);
      font-size: 0.8125rem;
      line-height: 1.65;
      overflow-wrap: anywhere;
    }
    .actions { display: grid; gap: 0.625rem; margin-block-start: 1.75rem; }
    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.625rem;
      min-block-size: 3rem;
      min-inline-size: 0;
      padding: 0.75rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--surface);
      color: var(--fg);
      font-size: 0.9375rem;
      font-weight: 600;
      line-height: 1.6;
      text-align: center;
      text-decoration: none;
      overflow-wrap: anywhere;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }
    .button > span { min-inline-size: 0; }
    .button svg { flex: 0 0 auto; }
    .button.primary { border-color: var(--primary-bg); background: var(--primary-bg); color: var(--primary-fg); }
    a.button:hover { border-color: var(--fg); color: var(--fg); background: var(--surface); }
    a.button.primary:hover { border-color: var(--primary-hover); background: var(--primary-hover); color: var(--primary-fg); }
    a.button:active { border-color: var(--fg); box-shadow: inset 0 0 0 1px var(--fg); }
    a.button.primary:active { background: var(--primary-hover); color: var(--primary-fg); }
    a:focus-visible { outline: 3px solid var(--fg); outline-offset: 4px; }
    .button[aria-disabled="true"] { background: var(--subtle); color: var(--muted); border-color: var(--border); cursor: not-allowed; }
    .hint { margin-block-start: 1rem; color: var(--muted); font-size: 0.8125rem; line-height: 1.75; text-align: center; overflow-wrap: anywhere; text-wrap: pretty; }
    .hint strong { color: var(--fg); font-weight: 600; }
    .notice { margin-block-start: 1.25rem; color: var(--muted); font-size: 0.875rem; text-wrap: pretty; overflow-wrap: anywhere; }
    .code-box { margin-block-start: 1.75rem; padding: 1rem 1.125rem; background: var(--subtle); border: 1px solid var(--border); border-radius: 0.625rem; }
    .code-box code { display: block; color: var(--fg); overflow-wrap: anywhere; }
    .footer { display: flex; align-items: center; gap: 0.375rem; margin-block-start: 1.25rem; padding-inline: 0.125rem; color: var(--muted); font-size: 0.75rem; }
    .footer svg { flex: 0 0 auto; }
    .invite-state { display: none; }
    body.pending #invite-pending,
    body.expired #invite-expired,
    body.already-accepted #invite-already-accepted { display: block; }
    @media (max-width: 30rem) {
      .brand { margin-block-end: 1.125rem; }
      .panel { border-radius: 0.875rem; }
      .data-row { grid-template-columns: minmax(0, 1fr); gap: 0.25rem; padding-block: 0.875rem; }
      .workspace { padding: 1rem; }
      .status-line { margin-block-end: 1.25rem; }
      .footer { margin-block-start: 1rem; }
    }
    @media (forced-colors: active) {
      .panel, .workspace, .badge, .code-box, .status-icon, .button { border-color: CanvasText; }
      .button[aria-disabled="true"] { color: GrayText; border-color: GrayText; }
      a:focus-visible { outline-color: Highlight; }
    }
  </style>
</head>
<body>
  <div class="page" data-od-id="page-shell">
    <header class="brand" aria-label="OpenDesign Hub" data-od-id="brand">OpenDesign <span class="brand-tag">Hub</span></header>
    <main class="panel" aria-labelledby="page-title" data-od-id="device-authorized">
        <div class="status-line" data-od-id="device-status">
          <span class="status-icon success"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="m6 12 4 4 8-8"/></svg></span>
          <p class="status-label">设备授权完成</p>
        </div>
      <h1 id="page-title" data-od-id="page-title">登录成功</h1>
      <p class="description">登录成功，可以回到 OpenDesign / Design Loom 应用继续。</p>
      <dl class="details" data-od-id="account-details">
        <div class="data-row" data-od-id="signed-in-user">
          <dt>已登录账户</dt>
          <dd><bdi class="identity-name">{{userName}}</bdi><bdi class="identity-email">{{userEmail}}</bdi></dd>
        </div>
        <div class="data-row" data-od-id="gitlab-host"><dt>GitLab 实例</dt><dd><bdi class="mono">{{gitlabHost}}</bdi></dd></div>
      </dl>
      <div class="actions" data-od-id="device-actions">
          <a class="button primary" href="{{deeplinkUrl}}" aria-label="返回应用" aria-describedby="app-hint" data-od-id="return-to-app"><span>返回应用</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></a>
      </div>
      <p class="hint" id="app-hint">如果应用没有自动打开，请手动切回应用</p>
    </main>
    <footer class="footer" data-od-id="page-footer"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="6" y="10" width="12" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>GitLab 身份验证</span></footer>
  </div>
</body>
</html>
